name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Verificar que nenhum segredo foi versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo "::error::.env commitado"; exit 1; fi
          if git grep -nE 'hf_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{35}'; then echo "::error::possível chave de API no código"; exit 1; fi
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar testes
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s src -v
